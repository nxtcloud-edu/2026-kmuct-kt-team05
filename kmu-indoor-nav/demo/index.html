<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>미래관 길찾기</title>
<style>
  :root{
    --bg:#0d1117; --sheet:#161b22; --fg:#e6edf3; --mut:#8b949e; --line:#2b313a;
    --acc:#3b82f6; --acc2:#60a5fa; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
    --sheet-h: 46vh;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; margin:0; overflow:hidden; overscroll-behavior:none}
  body{
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Malgun Gothic",system-ui,sans-serif;
    background:var(--bg); color:var(--fg);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 지도 ---------- */
  #map{position:fixed; inset:0; background:#fff; touch-action:none}
  #cv{position:absolute; inset:0; width:100%; height:100%}

  /* ---------- 상단 검색바 ---------- */
  #top{
    position:fixed; left:0; right:0; top:0; z-index:30;
    padding:calc(var(--safe-t) + 10px) 10px 10px;
    background:linear-gradient(180deg,rgba(13,17,23,.96) 60%,rgba(13,17,23,0));
    pointer-events:none;
  }
  #top > *{pointer-events:auto}
  #searchbar{
    display:flex; gap:8px; align-items:center;
    background:var(--sheet); border:1px solid var(--line); border-radius:14px;
    padding:6px 6px 6px 14px; box-shadow:0 6px 24px rgba(0,0,0,.45);
  }
  #q{
    flex:1; min-width:0; background:transparent; border:0; outline:0;
    color:var(--fg); font-size:16px; padding:10px 0;
  }
  #q::placeholder{color:var(--mut)}
  .iconbtn{
    flex:0 0 auto; width:42px; height:42px; border-radius:11px;
    border:1px solid var(--line); background:#1f242c; color:var(--fg);
    font-size:19px; display:grid; place-items:center; cursor:pointer;
  }
  .iconbtn:active{transform:scale(.94)}
  .iconbtn.rec{background:var(--err); border-color:var(--err); animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  #vhint{
    display:none; margin-top:7px; padding:8px 12px; border-radius:11px;
    background:rgba(239,68,68,.14); border:1px solid rgba(239,68,68,.4);
    color:#fca5a5; font-size:12.5px; font-weight:600;
  }
  #vhint.on{display:block}
  #chips{display:flex; gap:7px; overflow-x:auto; margin-top:9px; padding-bottom:2px;
         scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; padding:8px 13px; border-radius:20px; font-size:13px;
    background:rgba(22,27,34,.95); border:1px solid var(--line); color:var(--fg);
    white-space:nowrap; cursor:pointer;
  }
  .chip[aria-pressed="true"]{background:var(--acc); border-color:var(--acc); color:#fff; font-weight:700}

  /* ---------- 층 선택 (오른쪽 세로) ---------- */
  #floors{
    position:fixed; right:10px; z-index:25;
    top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:5px;
    background:rgba(22,27,34,.94); border:1px solid var(--line);
    border-radius:13px; padding:6px; box-shadow:0 6px 20px rgba(0,0,0,.4);
    max-height:52vh; overflow-y:auto; scrollbar-width:none;
  }
  #floors::-webkit-scrollbar{display:none}
  #floors button{
    width:44px; height:38px; border-radius:9px; border:1px solid transparent;
    background:transparent; color:var(--mut); font-size:13px; font-weight:700;
    cursor:pointer;
  }
  #floors button[data-onroute="1"]{color:var(--acc2); border-color:var(--acc)}
  #floors button[aria-pressed="true"]{background:var(--acc); color:#fff; border-color:var(--acc)}

  /* ---------- 지도 컨트롤 ---------- */
  #mapctl{
    position:fixed; right:10px; z-index:25; bottom:calc(var(--sheet-h) + 16px);
    display:flex; flex-direction:column; gap:6px;
  }
  #mapctl .iconbtn{width:44px; height:44px; background:rgba(22,27,34,.94);
                   box-shadow:0 4px 14px rgba(0,0,0,.4)}

  /* ---------- 하단 시트 ---------- */
  #sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    height:var(--sheet-h);
    background:var(--sheet); border-top:1px solid var(--line);
    border-radius:18px 18px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.5);
    display:flex; flex-direction:column;
    transition:height .22s cubic-bezier(.4,0,.2,1);
  }
  #sheet.collapsed{height:calc(96px + var(--safe-b))}
  #sheet.expanded{height:86vh}
  #grab{padding:9px 0 5px; display:grid; place-items:center; cursor:grab; flex:0 0 auto}
  #grab i{display:block; width:42px; height:4px; border-radius:3px; background:#3d444d}
  #sheetbody{flex:1; overflow-y:auto; padding:0 16px calc(16px + var(--safe-b));
             -webkit-overflow-scrolling:touch}

  /* ---------- 출발/도착 ---------- */
  #od{display:flex; gap:9px; align-items:center; margin-bottom:11px}
  #od .fields{flex:1; min-width:0; display:flex; flex-direction:column; gap:7px}
  .field{
    display:flex; align-items:center; gap:9px;
    background:#0d1117; border:1px solid var(--line); border-radius:11px;
    padding:9px 11px;
  }
  .field .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto}
  .field .dot.a{background:var(--ok)} .field .dot.b{background:var(--err)}
  .field select{
    flex:1; min-width:0; background:transparent; border:0; outline:0;
    color:var(--fg); font-size:15px; appearance:none; cursor:pointer;
  }
  #swap{width:40px; height:40px; flex:0 0 auto}

  /* ---------- 조건 ---------- */
  .label{font-size:12px; color:var(--mut); margin:12px 0 6px; font-weight:600}
  .opts{display:flex; gap:7px; flex-wrap:wrap}
  .opt{
    padding:9px 14px; border-radius:11px; font-size:14px;
    background:#0d1117; border:1px solid var(--line); color:var(--fg); cursor:pointer;
  }
  .opt[aria-pressed="true"]{background:var(--acc); border-color:var(--acc); color:#fff; font-weight:700}

  #go{
    width:100%; margin-top:14px; padding:15px; border-radius:13px; border:0;
    background:var(--acc); color:#fff; font-size:16px; font-weight:800; cursor:pointer;
  }
  #go:active{transform:scale(.99)}

  /* ---------- 결과 ---------- */
  #summary{display:none; gap:10px; align-items:baseline; margin:2px 0 4px}
  #summary.on{display:flex}
  #sumTime{font-size:27px; font-weight:800; letter-spacing:-.5px}
  #sumDist{font-size:15px; color:var(--mut)}
  #sumBadges{display:flex; gap:5px; flex-wrap:wrap; margin:6px 0 2px}
  .badge{padding:3px 9px; border-radius:8px; font-size:12px; font-weight:700}
  .b-ok{background:rgba(34,197,94,.16); color:#4ade80}
  .b-warn{background:rgba(245,158,11,.16); color:#fbbf24}
  .b-err{background:rgba(239,68,68,.16); color:#f87171}
  .b-mut{background:#21262d; color:var(--mut)}
  .b-acc{background:rgba(59,130,246,.18); color:var(--acc2)}

  #steps{list-style:none; margin:12px 0 0; padding:0}
  #steps li{
    display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line);
  }
  #steps li.done{opacity:.4}
  #steps .ic{
    flex:0 0 auto; width:34px; height:34px; border-radius:10px;
    display:grid; place-items:center; font-size:16px; background:#21262d;
  }
  #steps .ic.ev{background:rgba(59,130,246,.2); color:var(--acc2)}
  #steps .ic.st{background:rgba(245,158,11,.2); color:#fbbf24}
  #steps .tx{flex:1; min-width:0}
  #steps .fl{font-size:11px; color:var(--mut); font-weight:700}
  #steps .dn{
    margin-top:6px; padding:5px 12px; border-radius:8px; font-size:12px;
    background:#21262d; border:1px solid var(--line); color:var(--fg); cursor:pointer;
  }
  #reason{
    display:none; margin-top:11px; padding:12px; border-radius:11px;
    background:#0d1117; border:1px solid var(--line);
    font-size:13px; color:var(--mut); white-space:pre-wrap; line-height:1.6;
  }
  #reason.on{display:block}
  #meta{margin-top:16px; font-size:11.5px; color:#6e7681; line-height:1.7}

  /* ---------- 데스크톱 ---------- */
  @media (min-width:820px){
    :root{--sheet-h:100vh}
    #sheet{
      left:auto; right:0; top:0; bottom:0; width:400px; height:100vh !important;
      border-radius:0; border-top:0; border-left:1px solid var(--line);
    }
    #sheet.collapsed,#sheet.expanded{height:100vh !important}
    #grab{display:none}
    #sheetbody{padding-top:14px}
    #map{right:400px}
    #top{right:400px}
    #floors{right:414px}
    #mapctl{right:414px; bottom:20px}
  }
</style>
</head>
<body>

<div id="map"><canvas id="cv"></canvas></div>

<div id="top">
  <div id="searchbar">
    <input id="q" placeholder="예: 계단 없이 338호" autocomplete="off" enterkeyhint="search">
    <button class="iconbtn" id="mic" aria-label="음성 입력">🎤</button>
  </div>
  <div id="vhint" aria-live="polite"></div>
  <div id="chips">
    <span class="chip" data-ex="338호까지 가장 빠르게">338호</span>
    <span class="chip" data-ex="계단 없이 449호까지 가고 싶어">계단 없이 449호</span>
    <span class="chip" data-ex="휠체어를 타고 620호로 가고 싶어">휠체어 620호</span>
    <span class="chip" data-ex="202호에서 730호까지 가장 빠르게">202→730</span>
  </div>
</div>

<div id="floors"></div>

<div id="mapctl">
  <button class="iconbtn" id="zin" aria-label="확대">＋</button>
  <button class="iconbtn" id="zout" aria-label="축소">－</button>
  <button class="iconbtn" id="fit" aria-label="전체 보기">⤢</button>
</div>

<div id="sheet">
  <div id="grab"><i></i></div>
  <div id="sheetbody">

    <div id="summary">
      <span id="sumTime">–</span><span id="sumDist"></span>
    </div>
    <div id="sumBadges"></div>

    <div id="od">
      <div class="fields">
        <div class="field"><span class="dot a"></span><select id="from"></select></div>
        <div class="field"><span class="dot b"></span><select id="to"></select></div>
      </div>
      <button class="iconbtn" id="swap" aria-label="출발/도착 바꾸기">⇅</button>
    </div>

    <div class="label">이동 방식</div>
    <div class="opts" id="objOpts">
      <button class="opt" data-obj="fastest" aria-pressed="true">빠르게</button>
      <button class="opt" data-obj="indoor" aria-pressed="false">실내 위주</button>
      <button class="opt" data-obj="comfort" aria-pressed="false">편하게</button>
    </div>

    <div class="label">조건</div>
    <div class="opts">
      <button class="opt" id="oNoStairs" aria-pressed="false">계단 없이</button>
      <button class="opt" id="oWheel" aria-pressed="false">♿ 휠체어</button>
      <button class="opt" id="oCand" aria-pressed="false"
              title="접근성 근거가 없는 구간도 지나는 후보 경로를 봅니다. 확인된 경로가 아닙니다.">후보까지 보기</button>
    </div>

    <button id="go">길찾기</button>

    <div id="reason"></div>
    <ul id="steps"></ul>
    <div id="meta"></div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d");
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);

const A = {
  /* 기본은 통합 그래프(campus): 실외 + 미래관 외 건물 + 미래관 실내.
     'nav' 은 미래관만 담긴 옛 그래프라 캠퍼스가 보이지 않는다.
     ?graph=nav 로 강제할 수 있다. */
  graph:new URLSearchParams(location.search).get("graph") || "campus",
  places:[], floors:[], facilities:[],
  floor:null, imgs:{}, route:null, session:{}, done:new Set(),
  view:{k:1,tx:0,ty:0}, minK:0.05, maxK:14,
};

/* ================= 데이터 로드 ================= */
async function boot(){
  const st = await (await fetch(`/api/status?graph=${A.graph}`)).json();
  const vs = st.verification_scope || {};
  const p  = await (await fetch(`/api/places?graph=${A.graph}`)).json();
  A.places=p.places; A.floors=p.floors; A.facilities=p.facilities||[];

  A.floors.sort((a,b)=>b.sort_order-a.sort_order);

  /* 표시 공간(display_space)으로 묶는다. 캠퍼스 배치도처럼 여러 층이 한 장을
     공유하면 버튼 하나로 합친다. 미래관은 층마다 도면이 달라 그대로 층별이다. */
  A.spaces = [];
  const seen = {};
  for(const f of A.floors){
    const k = f.display_space || `plan:${f.id}`;
    if(!seen[k]){
      seen[k] = { key:k, floors:[], label:f.label, plan_image:f.plan_image,
                  plan_size:f.plan_size, shared:!!f.shares_plan };
      A.spaces.push(seen[k]);
    }
    seen[k].floors.push(f.id);
  }
  /* 공유 도면은 층 이름 대신 묶음 이름을 쓴다 (건물 22개를 나열할 수 없다) */
  for(const s of A.spaces){
    if(s.shared && s.floors.length>1) s.label = "캠퍼스";
  }
  A.spaceOf = {};
  for(const s of A.spaces) for(const fid of s.floors) A.spaceOf[fid]=s.key;

  $("#floors").innerHTML = A.spaces.map(s=>
    `<button data-s="${s.key}">${s.label.replace("지하","B").replace("층","")}</button>`).join("");
  $("#floors").querySelectorAll("button").forEach(b=>
    b.onclick=()=>setSpace(b.dataset.s,true));

  /* 출발/도착 목록.
     미래관은 호실 단위라 층별로 묶고, 그 외 건물은 층 단위 지점밖에 없으므로
     건물별로 묶는다. 층마다 optgroup 을 만들면 81개가 생겨 못 쓴다. */
  const groupOf = (p) => {
    const fid = p.floor_id || "";
    if(fid.startsWith("mirae/")){
      const f = A.floors.find(x=>x.id===fid);
      return "미래관 " + (f ? f.label : fid);
    }
    const parts = fid.split("/");           // campus/f/<건물>/<층>
    const b = parts.length>2 ? parts[2] : fid;
    return b==="OUTDOOR" ? "실외" : b;
  };
  /* 숫자 호실에만 '호'를 붙인다. '북악관 1층호' 가 되지 않게. */
  const isRoom = (s) => /^[0-9]/.test(String(s||""));
  const labelOf = (p) => {
    const r = p.room_label || p.name || p.id;
    if(!isRoom(r)) return r;
    const f = A.floors.find(x=>x.id===p.floor_id);
    return `${r}호 · ${f ? f.label : ""}`;
  };
  const groups = {};
  for(const p of A.places) (groups[groupOf(p)] ||= []).push(p);
  /* 미래관을 먼저, 그다음 실외, 그다음 건물 이름순 */
  const gkeys = Object.keys(groups).sort((a,b)=>{
    const rank = k => k.startsWith("미래관") ? 0 : (k==="실외" ? 1 : 2);
    return rank(a)-rank(b) || a.localeCompare(b,"ko");
  });
  const opt = gkeys.map(g=>{
    const it = groups[g].slice().sort((a,b)=>
      String(a.room_label).localeCompare(String(b.room_label),"ko",{numeric:true}));
    return `<optgroup label="${g}">`+
      it.map(x=>`<option value="${x.id}">${labelOf(x)}</option>`).join("")+
      `</optgroup>`;
  }).join("");
  $("#from").innerHTML=opt; $("#to").innerHTML=opt;
  pick("#from", ["campus/place/bukak_1f","mirae/F2/202","mirae/F1/102"]);
  pick("#to",   ["mirae/F3/338","mirae/F3/337"]);

  $("#meta").innerHTML =
    `${st.graph_version} · 층 ${A.floors.length}개 · 호실 ${A.places.length}개 · `+
    `엘리베이터 ${st.elevators_registered}대<br>`+
    `${vs.evidence_level||""}<br>소요시간은 추정값입니다.`;

  await setSpace(A.spaceOf["mirae/F3"] || A.spaces[0].key);
}
function pick(sel, cands){
  const el=$(sel);
  for(const c of cands){ if([...el.options].some(o=>o.value===c)){ el.value=c; return; } }
}

async function setSpace(key, manual){
  A.space = A.spaces.find(s=>s.key===key) || A.spaces[0];
  /* 이 공간에 속한 층 전체를 함께 그린다 */
  A.visible = new Set(A.space.floors);
  A.floor = A.floors.find(f=>f.id===A.space.floors[0]);
  $("#floors").querySelectorAll("button").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.s===A.space.key)));
  const img = A.space.plan_image;
  if(img && !A.imgs[A.space.key]){
    await new Promise(res=>{
      const im=new Image();
      im.onload=()=>{A.imgs[A.space.key]=im;res();};
      im.onerror=()=>res(); im.src=img;
    });
  }
  if(manual && A.route && isRouted(A.route)) fitRoute(); else fitAll();
}
/* 경로가 화면에 그릴 값이 있는 상태인가. 조사용 후보도 포함한다. */
function isRouted(r){
  return r && (r.status==="ok" || r.status==="candidate_unverified");
}
/* 층이 현재 화면에 보이는가 */
function onScreen(fid){ return A.visible ? A.visible.has(fid) : fid===A.floor?.id; }
/* 경로 구간이 현재 화면 좌표공간에 속하는가.
   space 는 좌표공간 문자열이다 (예: plan:mirae/F3, plan:campus/plan/overview). */
function segOnScreen(space){
  if(!space || space==="geo" || space==="transition") return false;
  if(space===A.space?.key) return true;
  return onScreen(String(space).replace(/^plan:/,""));
}

async function setFloor(fid, manual){
  return setSpace(A.spaceOf[fid] || `plan:${fid}`, manual);
}

/* ================= 뷰 ================= */
function resize(){
  const r=$("#map").getBoundingClientRect();
  cv.width=Math.round(r.width*DPR); cv.height=Math.round(r.height*DPR);
  draw();
}
function vw(){return cv.width/DPR}
function vh(){return cv.height/DPR}

function fitBox(x0,y0,x1,y1,padPx){
  const w=Math.max(1,x1-x0), h=Math.max(1,y1-y0);
  const pad=padPx ?? 26;
  const availW=vw()-pad*2, availH=vh()-pad*2-topPad()-botPad();
  const k=Math.min(availW/w, availH/h);
  A.view.k=Math.max(A.minK,Math.min(A.maxK,k));
  A.view.tx=pad+(availW-w*A.view.k)/2-x0*A.view.k;
  A.view.ty=topPad()+pad+(availH-h*A.view.k)/2-y0*A.view.k;
  draw();
}
function topPad(){ return $("#top").getBoundingClientRect().height*0.75; }
function botPad(){
  if(window.innerWidth>=820) return 20;
  return $("#sheet").getBoundingClientRect().height*0.55;
}
function fitAll(){
  const im=A.imgs[A.space?.key];
  if(!im){draw();return;}
  fitBox(0,0,im.width,im.height);
}
function fitRoute(){
  const pts=routePts();
  if(pts.length<2){fitAll();return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);
                      x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
  const m=Math.max(60,(x1-x0)*0.12,(y1-y0)*0.12);
  fitBox(x0-m,y0-m,x1+m,y1+m);
}
const T=(x,y)=>[x*A.view.k+A.view.tx, y*A.view.k+A.view.ty];

function routePts(){
  if(!isRouted(A.route))return [];
  const out=[];
  for(const s of A.route.segments){
    if(!segOnScreen(s.space)) continue;
    for(const p of (s.polyline_px||[])) out.push(p);
  }
  return out;
}

/* 현재 화면에서 경로가 시작되는 점과 끝나는 점.
   캠퍼스 배치도에는 장소 라벨을 띄우지 않으므로(건물명이 그림에 이미 있다)
   최소한 어디서 출발해 어디로 향하는지는 표시해야 한다. */
function routeEnds(){
  if(!isRouted(A.route)) return null;
  const segs=A.route.segments;
  const vis=[];
  for(let i=0;i<segs.length;i++){
    const s=segs[i];
    if(segOnScreen(s.space) && (s.polyline_px||[]).length) vis.push({i,s});
  }
  if(!vis.length) return null;
  const first=vis[0], last=vis[vis.length-1];
  const fp=first.s.polyline_px[0];
  const lpArr=last.s.polyline_px;
  const lp=lpArr[lpArr.length-1];
  return {
    start:fp, end:lp,
    /* 이 화면이 경로의 실제 시작/끝을 담고 있는가.
       아니면 다른 층에서 들어오거나 나가는 중간 구간이다. */
    isOrigin:first.i===0,
    isDest:last.i===segs.length-1,
  };
}

/* ================= 렌더 ================= */
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,vw(),vh());
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,vw(),vh());

  const im=A.imgs[A.space?.key];
  if(im){
    ctx.save();
    ctx.setTransform(DPR*A.view.k,0,0,DPR*A.view.k, DPR*A.view.tx, DPR*A.view.ty);
    ctx.imageSmoothingEnabled = A.view.k < 2;
    ctx.drawImage(im,0,0);
    ctx.restore();
  }

  // 경로
  const pts=routePts();
  if(pts.length>1){
    // 외곽 흰 테두리 -> 본선
    for(const [w,col] of [[11,"rgba(255,255,255,.95)"],[6.5,"#2563eb"]]){
      ctx.lineWidth=w; ctx.strokeStyle=col;
      ctx.lineJoin="round"; ctx.lineCap="round";
      ctx.beginPath();
      pts.forEach((p,i)=>{const [x,y]=T(p[0],p[1]); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      ctx.stroke();
    }
    marker(pts[0], "#16a34a", "출발");
    marker(pts[pts.length-1], "#dc2626", "도착");
  }

  // 시설 아이콘 (현재 화면)
  // 공유 도면(캠퍼스 배치도)에서는 그리지 않는다. 층마다 좌표가 같아서
  // 한 건물에 16개가 겹쳐 찍힌다.
  if(!A.space?.shared) for(const f of A.facilities){
    if(!onScreen(f.floor_id)) continue;
    const [x,y]=T(f.x,f.y);
    if(x<-30||y<-30||x>vw()+30||y>vh()+30) continue;
    const ico = f.kind==="elevator_lobby"?"🛗":(f.kind==="stair_landing"?"🪜":"🚪");
    ctx.font="15px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle="rgba(255,255,255,.9)";
    ctx.beginPath(); ctx.arc(x,y,11,0,7); ctx.fill();
    ctx.strokeStyle="#94a3b8"; ctx.lineWidth=1.2; ctx.stroke();
    ctx.fillText(ico,x,y+1);
  }

  // 호실 라벨 (확대 시)
  //
  // 캠퍼스 배치도에서는 띄우지 않는다. 이유가 둘이다.
  //   1) 배치도 그림에 건물 이름이 이미 인쇄되어 있다 (중복).
  //   2) 건물 좌표가 층마다 같아서 '북악관 1층'~'16층' 이 한 점에 쌓인다.
  // 미래관처럼 층별 도면이 있는 화면에서는 호실 번호가 꼭 필요하므로 그린다.
  if(A.view.k>0.55 && !A.space?.shared){
    ctx.font=`700 ${Math.min(15,10+A.view.k*2)}px system-ui`;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for(const p of A.places){
      if(!onScreen(p.floor_id)||!p.label_plan_point) continue;
      const [x,y]=T(p.label_plan_point.x_px,p.label_plan_point.y_px);
      if(x<0||y<0||x>vw()||y>vh()) continue;
      const t=p.room_label;
      const w=ctx.measureText(t).width+10;
      ctx.fillStyle="rgba(13,17,23,.82)";
      roundRect(x-w/2,y-10,w,20,6); ctx.fill();
      ctx.fillStyle="#fff"; ctx.fillText(t,x,y);
    }
  }

  // 경로 시작/끝 표시
  drawEnds();
}

/* 출발·도착(또는 화면 진입·이탈) 표시. 라벨 2개만 띄운다. */
function drawEnds(){
  const e=routeEnds();
  if(!e) return;
  const name = (sel)=>{
    const o=$(sel).selectedOptions[0];
    return o ? o.textContent.replace(/ ·.*$/,"") : "";
  };
  const items=[
    {p:e.start, col:"#22c55e",
     t:e.isOrigin ? `출발 ${name("#from")}` : "여기로 들어옴"},
    {p:e.end, col:"#ef4444",
     t:e.isDest ? `도착 ${name("#to")}` : "여기서 층 이동"},
  ];
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(const it of items){
    const [x,y]=T(it.p[0],it.p[1]);
    if(x<-60||y<-60||x>vw()+60||y>vh()+60) continue;
    ctx.beginPath(); ctx.arc(x,y,7,0,7);
    ctx.fillStyle=it.col; ctx.fill();
    ctx.lineWidth=2.5; ctx.strokeStyle="#fff"; ctx.stroke();
    ctx.font="700 12px system-ui";
    const w=ctx.measureText(it.t).width+12;
    ctx.fillStyle="rgba(13,17,23,.88)";
    roundRect(x-w/2,y-30,w,19,6); ctx.fill();
    ctx.fillStyle="#fff"; ctx.fillText(it.t,x,y-20.5);
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function marker(p,color,text){
  const [x,y]=T(p[0],p[1]);
  ctx.beginPath(); ctx.arc(x,y,13,0,7); ctx.fillStyle=color; ctx.fill();
  ctx.lineWidth=3.5; ctx.strokeStyle="#fff"; ctx.stroke();
  ctx.font="700 11px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#fff"; ctx.fillText(text.slice(0,2),x,y+.5);
}

/* ================= 제스처 ================= */
let ptrs=new Map(), pinch=null;
const el=$("#map");
el.addEventListener("pointerdown",e=>{
  el.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:A.view.k,
           cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,tx:A.view.tx,ty:A.view.ty};
  }
});
el.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const nk=Math.max(A.minK,Math.min(A.maxK,pinch.k*(d/pinch.d)));
    const r=el.getBoundingClientRect();
    const sx=pinch.cx-r.left, sy=pinch.cy-r.top;
    const px=(sx-pinch.tx)/pinch.k, py=(sy-pinch.ty)/pinch.k;
    A.view.k=nk; A.view.tx=sx-px*nk; A.view.ty=sy-py*nk;
    draw(); return;
  }
  if(ptrs.size===1){
    A.view.tx+=e.clientX-prev.x; A.view.ty+=e.clientY-prev.y; draw();
  }
});
for(const ev of ["pointerup","pointercancel","pointerleave"])
  el.addEventListener(ev,e=>{ptrs.delete(e.pointerId); if(ptrs.size<2)pinch=null;});
el.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=el.getBoundingClientRect(), sx=e.clientX-r.left, sy=e.clientY-r.top;
  const px=(sx-A.view.tx)/A.view.k, py=(sy-A.view.ty)/A.view.k;
  A.view.k=Math.max(A.minK,Math.min(A.maxK,A.view.k*(e.deltaY<0?1.18:1/1.18)));
  A.view.tx=sx-px*A.view.k; A.view.ty=sy-py*A.view.k; draw();
},{passive:false});

function zoomBy(f){
  const sx=vw()/2, sy=(topPad()+vh()-botPad())/2;
  const px=(sx-A.view.tx)/A.view.k, py=(sy-A.view.ty)/A.view.k;
  A.view.k=Math.max(A.minK,Math.min(A.maxK,A.view.k*f));
  A.view.tx=sx-px*A.view.k; A.view.ty=sy-py*A.view.k; draw();
}
$("#zin").onclick=()=>zoomBy(1.45);
$("#zout").onclick=()=>zoomBy(1/1.45);

const sheet=$("#sheet");
let sy0=null, sh0=0;
function sheetState(s){

$("#grab").addEventListener("pointerdown",e=>{

async function findRoute(){
  $("#go").textContent="찾는 중…";
  const qs=new URLSearchParams({
    graph:A.graph, from:$("#from").value, to:$("#to").value,
    objective:objective(),
    no_stairs:$("#oNoStairs").getAttribute("aria-pressed")==="true"?"1":"0",
    wheelchair:$("#oWheel").getAttribute("aria-pressed")==="true"?"1":"0",
    candidate:$("#oCand").getAttribute("aria-pressed")==="true"?"1":"0",
  });
  let r;
  try{ r=await (await fetch("/api/route?"+qs)).json(); }
  catch(err){ r={status:"error",reasons:["서버 요청 실패: "+err.message]}; }
  $("#go").textContent="길찾기";
  A.route=r; A.done.clear();
  render(r);
  const touched=new Set((r.metrics&&r.metrics.floors_touched)||[]);
  $("#floors").querySelectorAll("button").forEach(b=>{
    const s=A.spaces.find(x=>x.key===b.dataset.s);
    b.dataset.onroute = (s && s.floors.some(f=>touched.has(f))) ? "1":"0";
  });
  if(isRouted(r)){
    const f0=r.metrics.floors_touched[0];
    if(f0 && !onScreen(f0)) await setFloor(f0);
    fitRoute();
    sheetState(null);
  } else draw();
}
$("#go").onclick=findRoute;

function render(r){
  const S=$("#summary"), B=$("#sumBadges"), R=$("#reason"), L=$("#steps");
  if(isRouted(r)){
    const m=r.metrics, t=Math.round(m.estimated_time_s);
    const mm=Math.floor(t/60), ss=t%60;
    S.classList.add("on");
    $("#sumTime").textContent = mm>0?`${mm}분 ${ss}초`:`${ss}초`;
    $("#sumDist").textContent = `· ${m.distance_m ?? "-"} m`;
    const bs=[];
    bs.push(`<span class="badge ${m.stair_segments===0?"b-ok":"b-warn"}">${
      m.stair_segments===0?"계단 없음":"계단 "+m.stair_segments+"구간"}</span>`);
    if(m.elevator_boardings>0)
      bs.push(`<span class="badge b-acc">🛗 ${m.elevator_boardings}회</span>`);
    if(m.floors_touched.length>1)
      bs.push(`<span class="badge b-mut">${m.floors_touched.map(fl=>{
        const f=A.floors.find(x=>x.id===fl); return f?f.label:fl;}).join(" → ")}</span>`);
    bs.push(`<span class="badge b-mut">추정</span>`);
    /* 조사용 후보 경로는 확인된 경로와 반드시 구분해서 보여준다 */
    if(r.status==="candidate_unverified"){
      bs.push(`<span class="badge b-warn">접근성 미확인</span>`);
      R.classList.add("on");
      R.innerHTML = `<b>접근성이 확인된 경로가 아닙니다.</b><br>`+
        `근거가 없는 구간 ${(r.segments_requiring_survey||[]).length}개를 지납니다. `+
        `현장 확인이 필요합니다.`;
    } else {
      R.classList.remove("on");
    }
    B.innerHTML=bs.join("");
    L.innerHTML = r.instructions.map((s,i)=>{
      const ev=/엘리베이터/.test(s.text), st=/계단/.test(s.text);
      const ic=ev?"🛗":(st?"🪜":(/통과/.test(s.text)?"🚪":"↑"));
      return `<li data-i="${i}">
        <span class="ic ${ev?"ev":(st?"st":"")}">${ic}</span>
        <span class="tx"><span class="fl">${s.floor_label||""}</span><br>${s.text}
        ${s.confirm_prompt?`<br><button class="dn" onclick="doneStep(${i})">완료</button>`:""}
        </span></li>`;
    }).join("");
  } else {
    S.classList.remove("on"); B.innerHTML="";
    const label={needs_clarification:"확인 필요",
      insufficient_verified_data:"자료 부족",
      no_route_under_constraints:"경로 없음",
      outside_coverage:"지원 범위 밖", error:"오류"}[r.status]||r.status;
    R.classList.add("on");
    R.innerHTML=`<b class="badge b-err">${label}</b><br><br>`+
      (r.reasons||[]).map(x=>"· "+x).join("\n");
    L.innerHTML="";
  }
}

/* ================= 음성 / 텍스트 ================= */
// 음성 인식 지속시간 설정
const VOICE = {
  MAX_MS: 30000,      // 최대 녹음 시간 (이후 자동 종료)
  SILENCE_MS: 4500,   // 마지막 발화 후 이 시간 무음이면 종료
  AUTO_RESTART: true, // 브라우저가 임의로 끊으면 시간 안에서 재시작
};

async function ask(){
  const text=$("#q").value.trim(); if(!text)return;
  const qs=new URLSearchParams({text,session:JSON.stringify(A.session),graph:A.graph});
  const it=await (await fetch("/api/intent?"+qs)).json();
  A.session=it.session||{};
  $("#objOpts").querySelectorAll(".opt").forEach(x=>
    x.setAttribute("aria-pressed",String(x.dataset.obj===it.objective)));
  $("#oNoStairs").setAttribute("aria-pressed",String(it.constraints.no_stairs));
  $("#oWheel").setAttribute("aria-pressed",String(it.constraints.wheelchair));
  for(const [k,sel] of [["destination","#to"],["origin","#from"]]){
    const pid=it[k].place_id; if(!pid)continue;
    const pl=A.places.find(p=>p.door_node_ids.includes(pid));
    if(pl) $(sel).value=pl.id;
  }
  if(!it.destination.place_id){
    render({status:"needs_clarification",
      reasons:["목적지를 확정하지 못했습니다. 등록된 호실만 안내합니다.",
               "아래에서 직접 선택하거나 호실 번호를 정확히 말해 주세요."]});
    sheetState("expanded");
    return;
  }
  await findRoute();
}
$("#q").addEventListener("keydown",e=>{ if(e.key==="Enter"){e.target.blur(); ask();} });
document.querySelectorAll(".chip[data-ex]").forEach(c=>
  c.onclick=()=>{ $("#q").value=c.dataset.ex; ask(); });

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const V = {rec:null, t0:0, lastVoice:0, stopping:false,
           timer:null, silence:null, finalText:"", interim:""};

function voiceUI(on, msg){
  const mic=$("#mic"), hint=$("#vhint");
  mic.classList.toggle("rec", on);
  mic.textContent = on ? "■" : "🎤";
  hint.classList.toggle("on", on || !!msg);
  hint.textContent = msg || "";
}
function tick(){
  const left=Math.max(0, VOICE.MAX_MS-(Date.now()-V.t0));
  const sil=Math.max(0, VOICE.SILENCE_MS-(Date.now()-V.lastVoice));
  voiceUI(true, `듣고 있습니다… ${Math.ceil(left/1000)}초 남음`+
                (sil<VOICE.SILENCE_MS-400?`  ·  ${Math.ceil(sil/1000)}초 뒤 자동 종료`:"")+
                `   (탭하면 바로 종료)`);
}
function stopVoice(submit){
  if(V.stopping) return;
  V.stopping = true;
  clearInterval(V.timer); V.timer=null;
  if(V.rec){ try{ V.rec.onend=null; V.rec.stop(); }catch(e){} }
  V.rec=null;
  voiceUI(false, "");
  const t=($("#q").value||"").trim();
  if(submit && t) ask();
}
function startRec(){
  const rec=new SR();
  rec.lang="ko-KR"; rec.interimResults=true; rec.continuous=true;
  if("maxAlternatives" in rec) rec.maxAlternatives=1;
  rec.onresult=ev=>{
    V.lastVoice=Date.now();
    let fin=V.finalText, int="";
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const r=ev.results[i];
      if(r.isFinal) fin += r[0].transcript;
      else int += r[0].transcript;
    }
    V.finalText=fin; V.interim=int;
    $("#q").value=(fin+int).trim();
  };
  rec.onspeechstart=()=>{ V.lastVoice=Date.now(); };
  rec.onspeechend=()=>{ V.lastVoice=Date.now(); };
  rec.onerror=ev=>{
    if(ev.error==="no-speech"){ V.lastVoice=Date.now(); return; }  // 무음은 무시
    if(ev.error==="aborted") return;
    stopVoice(false);
    render({status:"needs_clarification",
      reasons:[`음성 인식 실패: ${ev.error}`,
               "텍스트 입력이나 아래 목록 선택으로 진행하세요."]});
    sheetState("expanded");
  };
  rec.onend=()=>{
    // 브라우저가 임의로 끊은 경우: 제한 시간 안이면 이어서 재시작
    if(V.stopping) return;
    const within = Date.now()-V.t0 < VOICE.MAX_MS;
    const quiet  = Date.now()-V.lastVoice > VOICE.SILENCE_MS;
    if(VOICE.AUTO_RESTART && within && !quiet){
      try{ V.rec=startRec(); return; }catch(e){}
    }
    stopVoice(true);
  };
  rec.start();
  return rec;
}
$("#mic").onclick=()=>{
  if(V.rec){ stopVoice(true); return; }
  if(!SR){
    render({status:"needs_clarification",
      reasons:["이 브라우저는 음성 인식을 지원하지 않습니다.",
               "Chrome 또는 Edge 에서 열거나, 텍스트/목록으로 선택해 주세요."]});
    sheetState("expanded"); return;
  }
  V.stopping=false; V.finalText=""; V.interim="";
  V.t0=Date.now(); V.lastVoice=Date.now();
  $("#q").value="";
  try{ V.rec=startRec(); }
  catch(e){
    render({status:"needs_clarification",reasons:["마이크를 열 수 없습니다: "+e.message]});
    sheetState("expanded"); return;
  }
  voiceUI(true, "듣고 있습니다…");
  V.timer=setInterval(()=>{
    tick();
    if(Date.now()-V.t0 > VOICE.MAX_MS) stopVoice(true);
    else if(Date.now()-V.lastVoice > VOICE.SILENCE_MS) stopVoice(true);
  },250);
};

window.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>setTimeout(resize,250));
resize(); boot();
</script>
</body>
