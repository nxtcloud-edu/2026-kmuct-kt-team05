<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="b1Title b1Desc">
  <title id="b1Title">북악관 1층 평면도</title>
  <desc id="b1Desc">북악관 1층 도면입니다. 서쪽 계단 아래에 로비가 있고, 남서쪽으로 캠퍼스 광장으로 나가는 서쪽 출구가 있습니다.</desc>

  <defs>
    <pattern id="b1stair" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#ffffff" />
      <line x1="0" y1="0" x2="9" y2="0" stroke="#94a3b8" stroke-width="2" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#f8fafc" />

  <g font-family="system-ui, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
    <text x="60" y="52" font-size="20" font-weight="700" fill="#334155">북악관 1F</text>
    <text x="155" y="52" font-size="13" fill="#94a3b8">로비 · 서쪽 출구</text>

    <rect x="60" y="80" width="680" height="360" rx="6" fill="#ffffff" stroke="#b6c2d1" stroke-width="4" />

    <!-- 복도 -->
    <rect x="110" y="225" width="590" height="50" fill="#eef2f7" stroke="#dde5ee" stroke-width="2" />

    <!-- 로비 (개방 공간) -->
    <rect x="262" y="180" width="180" height="140" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
    <text x="352" y="205" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">로비</text>

    <!-- 북쪽 실 -->
    <g stroke="#cbd5e1" stroke-width="2" fill="#fbfdff">
      <rect x="110" y="100" width="145" height="125" />
      <rect x="450" y="100" width="120" height="125" />
      <rect x="575" y="100" width="125" height="125" />
    </g>
    <g font-size="14" fill="#64748b" text-anchor="middle">
      <text x="182" y="168">경비실</text>
      <text x="510" y="168">105</text>
      <text x="637" y="168">106</text>
    </g>

    <!-- 남쪽 실 -->
    <g stroke="#cbd5e1" stroke-width="2" fill="#fbfdff">
      <rect x="450" y="275" width="120" height="140" />
      <rect x="575" y="275" width="125" height="140" />
    </g>
    <g font-size="14" fill="#64748b" text-anchor="middle">
      <text x="510" y="350">101</text>
      <text x="637" y="350">102</text>
    </g>

    <!-- 서쪽 계단 -->
    <g>
      <rect x="162" y="227" width="56" height="46" fill="url(#b1stair)" stroke="#94a3b8" stroke-width="2" />
      <text x="190" y="300" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">계단</text>
      <text x="190" y="316" font-size="11" fill="#8b5cf6" text-anchor="middle">↑ 2F ~ 5F</text>
    </g>

    <!-- 서쪽 출구 -->
    <g>
      <path d="M 62 330 L 62 390" stroke="#ffffff" stroke-width="8" />
      <path d="M 62 330 L 62 390" stroke="#475569" stroke-width="4" stroke-dasharray="7 6" />
      <path d="M 100 360 L 72 360" fill="none" stroke="#334155" stroke-width="3"
            stroke-linecap="round" marker-end="none" />
      <path d="M 82 352 L 72 360 L 82 368" fill="none" stroke="#334155" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round" />
      <text x="168" y="365" font-size="13" font-weight="700" fill="#334155">서쪽 출구</text>
      <text x="168" y="383" font-size="11" fill="#7c8a9c">→ 중앙 광장 (실외)</text>
    </g>
  </g>
</svg>
