<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="b4Title b4Desc">
  <title id="b4Title">북악관 4층 평면도</title>
  <desc id="b4Desc">북악관 4층 도면입니다. 가운데 동서 방향 복도가 있고, 서쪽 끝에 계단, 동쪽 끝에 조형관 3층으로 이어지는 연결통로가 있습니다. 411호는 복도 북쪽에 있습니다.</desc>

  <defs>
    <pattern id="b4stair" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#ffffff" />
      <line x1="0" y1="0" x2="9" y2="0" stroke="#94a3b8" stroke-width="2" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#f8fafc" />

  <g font-family="system-ui, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
    <text x="60" y="52" font-size="20" font-weight="700" fill="#334155">북악관 4F</text>
    <text x="155" y="52" font-size="13" fill="#94a3b8">동쪽 끝에 조형관 3F 연결통로</text>

    <!-- 외벽 -->
    <rect x="60" y="80" width="680" height="360" rx="6" fill="#ffffff" stroke="#b6c2d1" stroke-width="4" />

    <!-- 복도 -->
    <rect x="110" y="225" width="590" height="50" fill="#eef2f7" stroke="#dde5ee" stroke-width="2" />
    <text x="405" y="256" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="6">복 도</text>

    <!-- 북쪽 강의실 -->
    <g stroke="#cbd5e1" stroke-width="2" fill="#fbfdff">
      <rect x="110" y="100" width="140" height="125" />
      <rect x="255" y="100" width="150" height="125" />
      <rect x="410" y="100" width="120" height="125" />
      <rect x="535" y="100" width="165" height="125" />
    </g>
    <g font-size="15" fill="#64748b" text-anchor="middle">
      <text x="180" y="168">408</text>
      <text x="330" y="168">409</text>
      <text x="597" y="168">412</text>
    </g>

    <!-- 411호 강조 -->
    <rect x="410" y="100" width="120" height="125" fill="#eff6ff" stroke="#60a5fa" stroke-width="3" />
    <text x="470" y="160" font-size="19" font-weight="700" fill="#1d4ed8" text-anchor="middle">411</text>
    <text x="470" y="182" font-size="12" fill="#3b82f6" text-anchor="middle">강의실</text>

    <!-- 남쪽 강의실 -->
    <g stroke="#cbd5e1" stroke-width="2" fill="#fbfdff">
      <rect x="110" y="275" width="140" height="140" />
      <rect x="255" y="275" width="150" height="140" />
      <rect x="410" y="275" width="120" height="140" />
      <rect x="535" y="275" width="165" height="140" />
    </g>
    <g font-size="15" fill="#64748b" text-anchor="middle">
      <text x="180" y="350">401</text>
      <text x="330" y="350">402</text>
      <text x="470" y="350">403</text>
      <text x="597" y="350">404</text>
    </g>

    <!-- 서쪽 계단 -->
    <g>
      <rect x="162" y="227" width="56" height="46" fill="url(#b4stair)" stroke="#94a3b8" stroke-width="2" />
      <text x="190" y="300" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">계단</text>
      <text x="190" y="316" font-size="11" fill="#8b5cf6" text-anchor="middle">1F까지 58칸</text>
    </g>

    <!-- 동쪽 연결통로 -->
    <g>
      <rect x="700" y="232" width="88" height="36" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="3" />
      <path d="M 744 244 L 762 250 L 744 256" fill="none" stroke="#059669" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" />
      <text x="722" y="300" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">연결통로</text>
      <text x="722" y="316" font-size="11" fill="#059669" text-anchor="middle">→ 조형관 3F</text>
    </g>
  </g>
</svg>
