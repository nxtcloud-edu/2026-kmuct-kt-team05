<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="j1Title j1Desc">
  <title id="j1Title">조형관 1층 평면도</title>
  <desc id="j1Desc">조형관 1층 도면입니다. 서쪽 정문으로 들어오면 로비가 있고, 로비 동쪽 계단으로 3층까지 40칸을 올라가야 합니다.</desc>

  <defs>
    <pattern id="j1stair" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#ffffff" />
      <line x1="0" y1="0" x2="9" y2="0" stroke="#94a3b8" stroke-width="2" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#f8fafc" />

  <g font-family="system-ui, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
    <text x="60" y="52" font-size="20" font-weight="700" fill="#334155">조형관 1F</text>
    <text x="155" y="52" font-size="13" fill="#94a3b8">정문 · 로비 · 계단</text>

    <rect x="60" y="80" width="680" height="360" rx="6" fill="#ffffff" stroke="#b6c2d1" stroke-width="4" />

    <!-- 복도 -->
    <rect x="150" y="275" width="550" height="50" fill="#eef2f7" stroke="#dde5ee" stroke-width="2" />
    <text x="500" y="306" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="6">복 도</text>

    <!-- 로비 -->
    <rect x="170" y="250" width="170" height="130" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
    <text x="255" y="274" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">로비</text>

    <!-- 실 -->
    <g stroke="#cbd5e1" stroke-width="2" fill="#fbfdff">
      <rect x="150" y="110" width="180" height="140" />
      <rect x="340" y="110" width="170" height="140" />
      <rect x="520" y="110" width="180" height="140" />
      <rect x="520" y="325" width="180" height="90" />
    </g>
    <g font-size="14" fill="#64748b" text-anchor="middle">
      <text x="240" y="185">전시실</text>
      <text x="425" y="185">104</text>
      <text x="610" y="185">105</text>
      <text x="610" y="375">101</text>
    </g>

    <!-- 계단 (로비 동쪽) -->
    <g>
      <rect x="372" y="277" width="56" height="46" fill="url(#j1stair)" stroke="#94a3b8" stroke-width="2" />
      <text x="400" y="352" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">계단</text>
      <text x="400" y="368" font-size="11" fill="#8b5cf6" text-anchor="middle">3F까지 40칸</text>
    </g>

    <!-- 정문 (서쪽) -->
    <g>
      <path d="M 62 360 L 62 420" stroke="#ffffff" stroke-width="8" />
      <path d="M 62 360 L 62 420" stroke="#475569" stroke-width="4" stroke-dasharray="7 6" />
      <text x="88" y="434" font-size="13" font-weight="700" fill="#334155">정문</text>
      <text x="88" y="452" font-size="11" fill="#7c8a9c">← 조형관 앞 계단 12칸</text>
    </g>
  </g>
</svg>
