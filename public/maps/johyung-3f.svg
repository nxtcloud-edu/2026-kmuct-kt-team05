<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="j3Title j3Desc">
  <title id="j3Title">조형관 3층 평면도</title>
  <desc id="j3Desc">조형관 3층 도면입니다. 서쪽 끝에 북악관 4층에서 건너오는 연결통로가 있고, 복도를 따라 동쪽으로 가면 302호가 있습니다. 이 층은 계단 없이 북악관에서 바로 올 수 있습니다.</desc>

  <defs>
    <pattern id="j3stair" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#ffffff" />
      <line x1="0" y1="0" x2="9" y2="0" stroke="#94a3b8" stroke-width="2" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#f8fafc" />

  <g font-family="system-ui, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
    <text x="60" y="52" font-size="20" font-weight="700" fill="#334155">조형관 3F</text>
    <text x="155" y="52" font-size="13" fill="#94a3b8">서쪽 끝에 북악관 4F 연결통로</text>

    <rect x="60" y="80" width="680" height="360" rx="6" fill="#ffffff" stroke="#b6c2d1" stroke-width="4" />

    <!-- 복도 -->
    <rect x="100" y="225" width="600" height="50" fill="#eef2f7" stroke="#dde5ee" stroke-width="2" />
    <text x="300" y="256" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="6">복 도</text>

    <!-- 북쪽 실 -->
    <g stroke="#cbd5e1" stroke-width="2" fill="#fbfdff">
      <rect x="170" y="100" width="150" height="125" />
      <rect x="325" y="100" width="175" height="125" />
      <rect x="505" y="100" width="120" height="125" />
      <rect x="630" y="100" width="70" height="125" />
    </g>
    <g font-size="15" fill="#64748b" text-anchor="middle">
      <text x="245" y="168">304</text>
      <text x="412" y="168">303</text>
      <text x="665" y="168">301</text>
    </g>

    <!-- 302호 강조 -->
    <rect x="505" y="100" width="120" height="125" fill="#ecfdf5" stroke="#34d399" stroke-width="3" />
    <text x="565" y="160" font-size="19" font-weight="700" fill="#047857" text-anchor="middle">302</text>
    <text x="565" y="182" font-size="12" fill="#059669" text-anchor="middle">강의실</text>

    <!-- 남쪽 실 -->
    <g stroke="#cbd5e1" stroke-width="2" fill="#fbfdff">
      <rect x="170" y="275" width="150" height="140" />
      <rect x="325" y="275" width="175" height="140" />
      <rect x="505" y="275" width="195" height="140" />
    </g>
    <g font-size="14" fill="#64748b" text-anchor="middle">
      <text x="245" y="350">실습실 A</text>
      <text x="412" y="350">실습실 B</text>
      <text x="602" y="350">306</text>
    </g>

    <!-- 계단 -->
    <g>
      <rect x="372" y="227" width="56" height="46" fill="url(#j3stair)" stroke="#94a3b8" stroke-width="2" />
      <text x="400" y="303" font-size="11" fill="#8b5cf6" text-anchor="middle">↓ 1F</text>
    </g>

    <!-- 서쪽 연결통로 -->
    <g>
      <rect x="18" y="232" width="82" height="36" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="3" />
      <path d="M 44 244 L 62 250 L 44 256" fill="none" stroke="#059669" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" />
      <text x="70" y="300" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">연결통로</text>
      <text x="70" y="316" font-size="11" fill="#059669" text-anchor="middle">← 북악관 4F</text>
    </g>
  </g>
</svg>
